<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OneContext OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #ffffff;
  }

  .container {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    padding: 44px 64px 36px;
    position: relative;
  }

  /* Subtle dot grid background */
  .container::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .header-logo {
    width: 110px;
    height: auto;
    color: #047857;
  }

  .header-text {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.5px;
  }

  /* Headline */
  .headline {
    margin-top: 24px;
    font-size: 46px;
    font-weight: 700;
    color: #111827;
    letter-spacing: -1.5px;
    line-height: 1.1;
    max-width: 700px;
    position: relative;
    z-index: 1;
  }

  /* Flow diagram area */
  .flow {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding: 0 20px;
  }

  .flow-inner {
    display: flex;
    align-items: center;
    gap: 0;
    position: relative;
  }

  /* Source / Tool columns */
  .flow-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 160px;
  }

  .flow-column.right-col {
    align-items: flex-start;
    margin-left: 12px;
  }

  .flow-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #374151;
  }

  .flow-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  /* SVG connection lines */
  .flow-connections {
    width: 120px;
    height: 140px;
    flex-shrink: 0;
  }

  /* Center hub */
  .flow-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    flex-shrink: 0;
    position: relative;
    top: 14px;
  }

  .center-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #047857;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px rgba(4, 120, 87, 0.08), 0 0 0 16px rgba(4, 120, 87, 0.04);
  }

  .center-circle svg {
    width: 44px;
    height: auto;
    color: #fff;
  }

  .center-badge {
    font-size: 12px;
    font-weight: 600;
    color: #047857;
    background: rgba(4, 120, 87, 0.08);
    padding: 4px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .tagline {
    font-size: 16px;
    font-weight: 500;
    color: #6b7280;
    letter-spacing: 0.3px;
  }

  .tagline span {
    color: #047857;
    font-weight: 600;
  }

  .footer-meta {
    font-size: 14px;
    color: #9ca3af;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" fill="none">
